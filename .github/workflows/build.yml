name: build

on:
  push:
  pull_request:

jobs:
  container:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
    steps:
      - uses: actions/checkout@v4
      - name: docker build
        run: docker build --platform ${{ matrix.platform }} -t rust-and-cmake .
